<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Background</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #111;
            color: white;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }
        .main-container {
            width: 400px;
            height: 800px;
            position: relative; /* Clave para posicionar el contenido y el canvas */
            border: 1px solid #444;
            border-radius: 10px;
            background-color: #00001a; /* Nuevo color de fondo para el contenedor */
            overflow: hidden; /* Oculta lo que se salga del contenedor */
        }
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Colocamos el canvas por encima del fondo del contenedor */
        }
        h1
        {
            font-size: 90px;
            color: red;
        }
        .arimo_normal {
          font-family: "Arimo", sans-serif;
          font-optical-sizing: auto;
          font-weight: 600;
          font-style: bold;
        }
        .pattaya-regular {
          font-family: "Pattaya", sans-serif;
          font-weight: 400;
          font-style: normal;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; /* Necesario para que z-index funcione */
            z-index: 2; /* Colocamos el contenido por encima del canvas */
            gap: 20px; /* Espacio entre la foto y los títulos */
        }
        .foto {
            width: 150px; /* Define un tamaño para la imagen */
            height: 150px;
            border-radius: 50%; /* Esto hace que la imagen sea redonda */
            object-fit: cover; /* Asegura que la imagen cubra el espacio sin deformarse */
            border: 5px solid white; /* Un borde opcional para que resalte */
            box-shadow:  5px 5px 10px #C0B4DB,
                     -1px -1px 10px #d7eaff;
        }
        .title{
          font-size: 40px;
          color: #fff     ;
          padding: 10px 0px;
          /* Efecto de resplandor para el título */
          text-shadow: 0 0 5px rgba(255, 255, 255, 1), 0 0 10px rgba(26, 79, 255, 0.6);
        }
        .subtitle{
          font-size: 26px;
          padding: 10px;
          text-shadow: 0 0 5px rgba(255, 255, 255, 1), 0 0 10px rgba(26, 79, 255, 0.6);
        }
        .titles__container {
          text-align: center;
          /* color: #6C738F; */
          color: #fff;
        }
        .container_title {
          /* height: 100px; */ /* Movido a .container_title */
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 15px; /* Espacio entre el título y el subtítulo */
        }
    </style>
</head>
<body>
    <div class="main-container">
          <div class="hero">
      <img class="foto" src="./foto.png" alt="Foto de perfil">
      <div class="titles__container">
        <div class="container_title">
          <h1 class="title pattaya-regular">Lenny Kravitz</h1>
        </div>
        <div class="container_subtitle">
          <h2 class="subtitle pattaya-regular">Rock Star</h2>
        </div>
      </div>
    </div>
        <canvas id="bg-canvas"></canvas>
        <!-- Aquí puedes poner tu contenido, como un formulario de contacto -->
    </div>
  

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.132.2';

        // 1. Configuración básica de la escena
        const scene = new THREE.Scene();
        const container = document.querySelector('.main-container');
        const canvas = document.getElementById('bg-canvas');

        const sizes = {
            width: container.clientWidth,
            height: container.clientHeight
        };

        // 2. Cámara
        const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
        camera.position.z = 30; // Ajustamos la posición de la cámara para ver las partículas
        scene.add(camera);

        // 3. Renderer
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            alpha: true
        });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 4. Crear las partículas de estrellas
        const starCount = 9000; // Número de estrellas
        const positions = new Float32Array(starCount * 3); // Cada partícula tiene 3 coordenadas (x, y, z)
        const colors = new Float32Array(starCount * 3); // Array para los colores (r, g, b)
        const starSizes = new Float32Array(starCount); // Array para los tamaños

        // Paleta de colores para las estrellas
        const colorPalette = [
            new THREE.Color(0xffff00), // Amarillo
            new THREE.Color(0x00aaff), // Azul
            new THREE.Color(0xff00ff)  // Rosa
        ];

        for (let i = 0; i < starCount; i++) {
            // Posición inicial aleatoria
            positions[i * 3] = (Math.random() - 0.5) * 60; // X
            positions[i * 3 + 1] = (Math.random() - 0.5) * 100;   // Y - Las distribuimos a lo largo de toda la altura
            positions[i * 3 + 2]_ = (Math.random() - 0.5) * 60; // Z
            
            // Asignar un color aleatorio de la paleta
            const randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i * 3] = randomColor.r;
            colors[i * 3 + 1] = randomColor.g;
            colors[i * 3 + 2] = randomColor.b;

            // Asignar un tamaño aleatorio
            starSizes[i] = Math.random() * 0.8 + 0.1;
        }

        const rainGeometry = new THREE.BufferGeometry();
        rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        rainGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        rainGeometry.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

        // Función para crear una textura de círculo
        const createCircleTexture = () => {
            const canvas = document.createElement('canvas');
            const size = 64; // Aumentamos el tamaño para más detalle en el degradado
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            const center = size / 2;

            // Crear un degradado radial (el "blur")
            const gradient = context.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');   // Centro blanco opaco
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)'); // Borde interior del resplandor
            gradient.addColorStop(1, 'rgba(255,255,255,0)');     // Borde exterior totalmente transparente

            context.fillStyle = gradient;
            context.beginPath();
            context.arc(center, center, center, 0, 2 * Math.PI);
            context.fill();

            return new THREE.CanvasTexture(canvas);
        };

        const circleTexture = createCircleTexture();

        const rainMaterial = new THREE.PointsMaterial({
            size: 0.1, // El tamaño base se multiplicará por el atributo 'size'
            transparent: true,
            vertexColors: true, // ¡Importante! Habilita los colores por vértice
            sizeAttenuation: true, // Hace que las partículas lejanas se vean más pequeñas
            map: circleTexture, // Usa la textura de círculo
            blending: THREE.AdditiveBlending, // Mezcla aditiva para un efecto de brillo
            depthWrite: false // Evita que las partículas se oculten entre sí de forma extraña
        });

        const stars = new THREE.Points(rainGeometry, rainMaterial);
        scene.add(stars);

        // 5. Animación
        const clock = new THREE.Clock();

        const animate = () => {
            const elapsedTime = clock.getElapsedTime();

            // Animación de partículas ascendentes
            for (let i = 0; i < starCount; i++) {
                const i3 = i * 3;
                positions[i3 + 1] += 0.05; // Mover hacia arriba

                // Si la partícula supera el límite superior, la reiniciamos abajo
                if (positions[i3 + 1] > 50) {
                    positions[i3 + 1] = -50;
                }
            }
            rainGeometry.attributes.position.needsUpdate = true; // ¡Importante! Notificar a Three.js que las posiciones han cambiado

            // Renderizar la escena
            renderer.render(scene, camera);

            // Llamar a animate en el siguiente frame
            window.requestAnimationFrame(animate);
        };

        animate();
    </script>
</body>
</html>
